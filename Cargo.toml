[package]
name = "quaddle-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
gorilla-physics = { path = "../gorilla-physics/"}
urdf-rs = "0.9.0"
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"


[lib]
name = "quaddle"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "main"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(rust_analyzer)'] }
